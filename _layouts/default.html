<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | sabdhagiri.github.io</title>
    <link rel="stylesheet" href="{{ 'assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ 'assets/css/journal.css' | relative_url }}">
    <link href="https:// fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
            <nav class="site-nav">
                <a href="/portfolio/">Portfolio</a>
                <a href="/journal/">Journal</a>
                <a href="/contact/">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container content py-5">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container text-center py-4">
            <p>&copy; {{ site.time | date: "%Y" }} sabdhagiri. Built with <a href="https://github.com/jekyll/jekyll" target="_blank">Jekyll</a>.</p>
            <div class="geek-tag">Casual Cool. Geeks. Code.</div>
        </div>
    </footer>
</body>
</html>
