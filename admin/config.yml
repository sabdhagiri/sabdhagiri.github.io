# Sveltia CMS configuration — editor UI at /admin/
# Docs: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: sabdhagiri/sabdhagiri.github.io
  branch: main
  commit_messages:
    create: "journal: add {{slug}}"
    update: "journal: update {{slug}}"
    delete: "journal: delete {{slug}}"
    uploadMedia: "journal: upload {{path}}"
    deleteMedia: "journal: delete {{path}}"

site_url: https://sabdhagiri.github.io
display_url: https://sabdhagiri.github.io

# Images uploaded in the editor
media_folder: assets/images/journal
public_folder: /assets/images/journal

collections:
  - name: journal
    label: Journal
    label_singular: Entry
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "journal/{{year}}/{{month}}/{{filename}}/"
    sortable_fields: [date, title]
    summary: "{{title}} — {{date}}"
    fields:
      - { name: layout, widget: hidden, default: post }
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss Z"
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Comma-separated, e.g. kubernetes, sre"
      - name: body
        label: Body
        widget: markdown
